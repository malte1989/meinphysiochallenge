services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ausfall
      POSTGRES_PASSWORD: ausfall
      POSTGRES_DB: ausfall
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ausfall"]
      interval: 2s
      timeout: 3s
      retries: 20
  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://ausfall:ausfall@db:5432/ausfall
      DATA_DIR: /data
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
  web:
    build: ./web
    environment:
      API_URL: http://api:3000
    depends_on:
      - api
    ports:
      - "5173:5173"
