name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (Typecheck, Unit- und Integrationstests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ausfall
          POSTGRES_PASSWORD: ausfall
          POSTGRES_DB: ausfall
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U ausfall" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://ausfall:ausfall@localhost:5433/ausfall
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:int

  web:
    name: Web (Typecheck, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  audit:
    name: Abhängigkeiten (npm audit)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        projekt: [api, web, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm audit --audit-level=high
        working-directory: ${{ matrix.projekt }}

  secrets:
    name: Secret-Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: E2E (Playwright gegen docker compose)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: docker compose up --build -d --wait
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-ergebnisse
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - run: docker compose logs
        if: failure()
      - run: docker compose down -v
        if: always()
